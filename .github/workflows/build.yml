name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test libraries, legacy compatibility and TUI
        run: dotnet test BmwCoder.slnx -c Release --verbosity quiet
      - name: Build legacy application
        run: dotnet build src\BmwCoder.App\BmwCoder.App.csproj -c Release --no-restore --verbosity quiet
      - name: Publish TUI
        run: dotnet publish src\BmwCoder.Tui\BmwCoder.Tui.csproj -c Release -r win-x64 --self-contained false -o artifacts\tui
      - name: Publish JSON CLI
        run: dotnet publish tools\BmwCoder.Cli\BmwCoder.Cli.csproj -c Release -r win-x64 --self-contained false -o artifacts\cli
      - uses: actions/upload-artifact@v4
        with:
          name: bimmeross-readonly-preview-win-x64
          path: artifacts\
